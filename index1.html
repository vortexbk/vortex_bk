<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex BK - AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 85vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            background-color: #0284c7;
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            letter-spacing: 0.5px;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #0284c7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #334155;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            padding: 12px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #1e293b;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 0 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>

    <!-- Gemini SDK Import Map -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Vortex BK AI</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">നമസ്കാരം! ഞാൻ Vortex BK AI ആണ്. നിങ്ങൾക്ക് എന്ത് സഹായമാണ് വേണ്ടത്?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="ചോദ്യം ഇവിടെ ടൈപ്പ് ചെയ്യൂ..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">അയക്കുക</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // നിങ്ങളുടെ പുതിയ API Key ഇവിടെ നൽകുക
        const API_KEY = "AIzaSyCr_zFNBHEBpOkTvULu2OHsPd_OuB91cbY";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        function addMessage(text, isUser) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(isUser ? "user-message" : "ai-message");
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        window.handleKeyPress = function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        };

        window.sendMessage = async function() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // യൂസറുടെ സന്ദേശം കാണിക്കുക
            addMessage(prompt, true);
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // ലോഡിംഗ് സന്ദേശം കാണിക്കുക
            const loadingMsg = addMessage("ടൈപ്പ് ചെയ്യുന്നു...", false);

            try {
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                });

                loadingMsg.innerText = response.text;
            } catch (error) {
                loadingMsg.innerText = "ക്ഷമിക്കണം, ഒരു പിശക് സംഭവിച്ചു: " + error.message;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    </script>

</body>
</html>
