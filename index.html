<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aazim | vortex_bk|Cybersecurity Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Gemini SDK Import Map -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff41;
            --secondary: #008f11;
            --accent: #ff003c;
            --dark: #0a0a0a;
            --darker: #000000;
            --light: #c8c8c8;
            --neon-glow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 40px var(--primary);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            line-height: 1.6;
            color: var(--light);
            background-color: var(--darker);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 65, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 143, 17, 0.05) 0%, transparent 20%),
                linear-gradient(to bottom, var(--darker), var(--dark));
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 2.5rem;
            display: inline-block;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary);
            box-shadow: var(--neon-glow);
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: var(--primary);
            border-radius: 0;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            border: 2px solid var(--primary);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary);
            transition: var(--transition);
            z-index: -1;
        }

        .btn:hover {
            color: var(--dark);
            box-shadow: var(--neon-glow);
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-accent {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-accent::before {
            background: var(--accent);
        }

        .btn-accent:hover {
            color: var(--dark);
            box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent), 0 0 40px var(--accent);
        }

        /* Header Styles */
        header {
            background-color: rgba(10, 10, 10, 0.9);
            box-shadow: 0 2px 10px rgba(0, 255, 65, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            text-shadow: var(--neon-glow);
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            font-weight: 600;
            color: var(--light);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--primary);
            text-shadow: var(--neon-glow);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
            box-shadow: var(--neon-glow);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(10, 10, 10, 0.9)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,0 L100,100 Z" fill="rgba(0,255,65,0.03)"/></svg>');
            color: var(--light);
            padding: 180px 0 100px;
            margin-top: 70px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 60, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-shadow: var(--neon-glow);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--light);
            font-weight: 300;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .hero .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .hero .btn:hover {
            background: var(--primary);
            color: var(--dark);
        }

        /* About Section */
        .about-content {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .about-img {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), var(--neon-glow);
            position: relative;
            border: 1px solid var(--primary);
        }

        .about-img img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
            filter: grayscale(30%) contrast(110%);
        }

        .about-img:hover img {
            transform: scale(1.05);
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .skill {
            background-color: rgba(0, 255, 65, 0.1);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 255, 65, 0.3);
            transition: var(--transition);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .skill:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--neon-glow);
        }

        /* Services Section */
        .services {
            background-color: rgba(10, 10, 10, 0.7);
            border-top: 1px solid rgba(0, 255, 65, 0.2);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background-color: rgba(20, 20, 20, 0.8);
            padding: 40px 30px;
            border-radius: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.2);
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), var(--neon-glow);
            border-color: var(--primary);
        }

        .service-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        /* Portfolio Section */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .portfolio-item {
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.5s;
            border-top: 1px solid var(--primary);
        }

        .portfolio-item:hover .portfolio-overlay {
            transform: translateY(0);
        }

        /* Memory Game Section */
        .memory-game-section {
            background-color: rgba(10, 10, 10, 0.7);
            border-top: 1px solid rgba(0, 255, 65, 0.2);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }

        .game-container {
            background: rgba(20, 20, 20, 0.9);
            border-radius: 0;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-header h3 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .info-box {
            text-align: center;
        }

        .info-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .info-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-front {
            background: #1a1a2e;
            transform: rotateY(180deg);
            font-size: 2.5rem;
            border: 1px solid var(--primary);
        }

        .card-back {
            background: #0a0a0a;
            border: 1px solid rgba(0, 255, 65, 0.5);
        }

        .card-back::after {
            content: "?";
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .game-btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-btn:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--neon-glow);
        }

        /* HackGame Bot Section */
        .hackgame-bot-section {
            background-color: rgba(10, 10, 10, 0.7);
            border-top: 1px solid rgba(0, 255, 65, 0.2);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }

        .hackgame-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.9);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 65, 0.5);
        }

        .hackgame-header {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.9), rgba(10, 10, 10, 0.9));
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        .hackgame-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
